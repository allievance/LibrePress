{% extends "base.html" %}

{% block title %}Shipping | LibrePress{% endblock %}

{% block content %}
<main class="cart-page">
    <h1>Shipping address</h1>

    <form action="/checkout" method="POST">
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="street1">Address</label>
            <input type="text" id="street1" name="street1" required>
        </div>
        <div class="form-group">
            <label for="street2">Address Line 2</label>
            <input type="text" id="street2" name="street2">
        </div>
        <div class="form-group">
            <label for="city">City</label>
            <input type="text" id="city" name="city" required>
        </div>
        <div class="form-group">
            <label for="state">State / Province</label>
            <input type="text" id="state" name="state" required>
        </div>
        <div class="form-group">
            <label for="zip_code">ZIP / Postal Code</label>
            <input type="text" id="zip_code" name="zip_code" required>
        </div>
        <button type="submit" class="add-to-cart">Proceed to Payment</button>
    </form>
</main>
{% endblock %}
